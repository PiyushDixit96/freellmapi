name: Upstream Sync & Test

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to sync and test against upstream'
        required: true
        default: 'main'
        type: string
      sync_strategy:
        description: 'Sync strategy: rebase (linear history) or merge'
        required: true
        default: 'rebase'
        type: choice
        options:
          - rebase
          - merge
      upstream_repo:
        description: 'Upstream source repository URL'
        required: true
        default: 'https://github.com/tashfeenahmed/freellmapi.git'
        type: string
      upstream_branch:
        description: 'Upstream branch'
        required: true
        default: 'main'
        type: string
      push_on_success:
        description: 'Push synced changes to target branch if all tests pass'
        required: true
        default: true
        type: boolean
  schedule:
    # Check upstream every 6 hours and auto rebase/sync main if tests pass
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: upstream-sync-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  sync-and-test:
    name: Sync from upstream & run test suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream commits
        id: fetch_upstream
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'https://github.com/tashfeenahmed/freellmapi.git' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          
          NEW_COMMITS=$(git log HEAD..upstream/$UPSTREAM_BRANCH --oneline || true)
          if [ -z "$NEW_COMMITS" ]; then
            echo "has_commits=false" >> $GITHUB_OUTPUT
            echo "Upstream is already up to date with target branch."
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "Found new commits in upstream:"
            echo "$NEW_COMMITS"
          fi

      - name: Attempt sync (rebase or merge)
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        id: sync_step
        env:
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
          STRATEGY: ${{ inputs.sync_strategy || 'rebase' }}
        run: |
          echo "Executing sync strategy: $STRATEGY with upstream/$UPSTREAM_BRANCH..."
          if [ "$STRATEGY" = "rebase" ]; then
            if ! git rebase upstream/$UPSTREAM_BRANCH; then
              # Auto-resolve modify/delete conflicts on intentionally removed upstream workflows
              while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                CONFLICTS=$(git diff --name-only --diff-filter=U)
                if [ -z "$CONFLICTS" ]; then
                  break
                fi
                ONLY_REMOVED_WORKFLOWS=true
                for f in $CONFLICTS; do
                  case "$f" in
                    .github/workflows/ci.yml|.github/workflows/cli-release.yml|.github/workflows/desktop-release.yml|.github/workflows/docker.yml)
                      git rm -f "$f"
                      ;;
                    *)
                      ONLY_REMOVED_WORKFLOWS=false
                      ;;
                  esac
                done
                if [ "$ONLY_REMOVED_WORKFLOWS" = true ]; then
                  GIT_EDITOR=true git rebase --continue && break || true
                else
                  echo "sync_status=conflict-rebase" >> $GITHUB_OUTPUT
                  echo "Rebase conflicts detected in:"
                  echo "$CONFLICTS"
                  git rebase --abort || true
                  echo "::error::Rebase conflicts detected with upstream. Manual resolution required."
                  exit 1
                fi
              done
            fi
            echo "sync_status=clean-rebase" >> $GITHUB_OUTPUT
            echo "Clean rebase succeeded."
          else
            if git merge upstream/$UPSTREAM_BRANCH --no-commit; then
              echo "sync_status=clean-merge" >> $GITHUB_OUTPUT
              echo "Clean auto-merge succeeded."
              git commit -m "chore(sync): automated merge from upstream/$UPSTREAM_BRANCH"
            else
              echo "sync_status=conflict-merge" >> $GITHUB_OUTPUT
              echo "Merge conflicts detected in:"
              git diff --name-only --diff-filter=U
              git merge --abort || true
              echo "::error::Merge conflicts detected with upstream. Manual resolution required."
              exit 1
            fi
          fi

      - name: Setup Node.js 22 LTS
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        run: npm ci

      - name: Check database migrations
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        run: npm run test:migrations

      - name: Check localization (i18n)
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        run: npm run check:i18n -w client

      - name: Run client tests
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        run: npm test -w client

      - name: Run server tests
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        run: npm test -w server

      - name: Build all packages
        if: steps.fetch_upstream.outputs.has_commits == 'true'
        run: npm run build

      - name: Push to target branch
        if: steps.fetch_upstream.outputs.has_commits == 'true' && (inputs.push_on_success != false || github.event_name == 'schedule')
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
          STRATEGY: ${{ inputs.sync_strategy || 'rebase' }}
        run: |
          echo "Pushing verified changes to origin/$TARGET_BRANCH..."
          git fetch origin "$TARGET_BRANCH"
          EXPECT_SHA=$(git rev-parse "origin/$TARGET_BRANCH")
          if [ "$STRATEGY" = "rebase" ]; then
            git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECT_SHA"
          else
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Workflow summary
        if: always()
        run: |
          echo "### Upstream Sync & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target branch**: \`${{ inputs.target_branch || 'main' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Sync strategy**: \`${{ inputs.sync_strategy || 'rebase' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream repo**: \`${{ inputs.upstream_repo || 'https://github.com/tashfeenahmed/freellmapi.git' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Has new commits**: \`${{ steps.fetch_upstream.outputs.has_commits }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Sync status**: \`${{ steps.sync_step.outputs.sync_status || 'skipped / up to date' }}\`" >> $GITHUB_STEP_SUMMARY

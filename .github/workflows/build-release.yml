name: Build Docker & Windows x64

on:
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build Docker image'
        required: true
        default: true
        type: boolean
      push_ghcr:
        description: 'Push Docker image to GitHub Container Registry (ghcr.io)'
        required: true
        default: true
        type: boolean
      build_win_exe:
        description: 'Build Windows x64 .exe (NSIS) & .zip'
        required: true
        default: true
        type: boolean
      build_win_msi:
        description: 'Build Windows x64 .msi'
        required: true
        default: true
        type: boolean
      image_tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    name: Build Docker Image
    if: ${{ inputs.build_docker != false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_ghcr == true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for GHCR
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: ${{ inputs.push_ghcr == true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.image_tag || 'latest' }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            FREELLMAPI_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (artifact only)
        if: ${{ inputs.push_ghcr != true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/freellmapi-image.tar
          build-args: |
            FREELLMAPI_COMMIT_SHA=${{ github.sha }}

      - name: Upload Docker tar artifact
        if: ${{ inputs.push_ghcr != true }}
        uses: actions/upload-artifact@v4
        with:
          name: freellmapi-docker-amd64
          path: /tmp/freellmapi-image.tar
          retention-days: 7

  build-windows:
    name: Build Windows x64 (.exe / .msi)
    if: ${{ inputs.build_win_exe != false || inputs.build_win_msi == true }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install root & desktop dependencies
        run: |
          npm ci
          npm --prefix desktop ci

      - name: Build client UI
        run: npm run build -w client

      - name: Build Windows x64 .exe (NSIS) & .zip
        if: ${{ inputs.build_win_exe != false }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:win

      - name: Build Windows x64 .msi
        if: ${{ inputs.build_win_msi == true }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build:all
          npm run stage:client
          npx electron-builder --win msi --x64 --publish never

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freellmapi-windows-x64
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.msi
            desktop/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 14
